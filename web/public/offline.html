<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오프라인 · Color Hunter</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #FFF7EA; color: #1B1433;
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; padding: 16px; }
  .card { max-width: 360px; background: #fff; border: 3px solid #1B1433; border-radius: 24px; box-shadow: 4px 4px 0 #1B1433; padding: 24px; text-align: center; }
  h1 { font-size: 22px; margin: 8px 0; }
  p { line-height: 1.6; color: #6E6787; }
  button { margin-top: 8px; min-height: 48px; padding: 0 20px; border: 3px solid #1B1433; border-radius: 16px; background: #FFC93C; font-weight: 700; font-size: 16px; box-shadow: 3px 3px 0 #1B1433; }
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:40px">📡</div>
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>Color Hunter는 실시간 멀티플레이 게임이라 온라인에서만 진행돼요. 연결을 확인한 뒤 다시 시도해 주세요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
