# web/ 을 정적 사이트로 빌드해 GitHub Pages 에 올림 (main 에 push 하면 자동)
# 주소: https://<계정>.github.io/<저장소 이름>/
# 게임 서버 주소를 바꾸려면: 저장소 Settings → Secrets and variables → Actions → Variables 에 SERVER_URL 추가
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SERVER_URL: ${{ vars.SERVER_URL || 'https://color-hunter.dlwjd.workers.dev' }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
